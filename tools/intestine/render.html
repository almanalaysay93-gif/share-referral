<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
// Reference: small intestine (stomach, duodenum loop, jejunum/ileum coils) from small_intestine_2.jpg.
// Procedural tube along a control path; radius varies with the bowel's folds; deep blue material.
const W=1120,H=1120;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setClearColor(0x000000,0);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,1,0.1,100);cam.position.set(0,0.2,9.5);cam.lookAt(0,-0.1,0);
scene.add(new THREE.HemisphereLight(0xdfeaff,0x061a33,1.4));
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(3,4,6);scene.add(key);
const rim=new THREE.DirectionalLight(0x9fc7ff,0.7);rim.position.set(-4,1,-3);scene.add(rim);
// Deep blue material (same family as the organ art)
const mat=new THREE.MeshStandardMaterial({color:0x0d3f6e,roughness:0.42,metalness:0.05,emissive:0x021a33,emissiveIntensity:0.25});
// Path: stomach (top, pouch) -> duodenum loop -> jejunum/ileum coils (lower, loops)
const pts=[
 [0.6,3.4,0],[0.9,2.7,0.1],[0.7,2.0,0.2],[-0.1,1.5,0.1],[-0.9,1.2,0.0],[-1.5,0.7,0.2],[-1.3,0.1,0.3],
 [-0.6,-0.1,0.3],[-0.9,-0.8,0.1],[-0.4,-1.2,0.0],[0.3,-0.9,0.4],[0.9,-0.4,0.3],[1.5,-0.9,0.1],[1.8,-1.6,0.2],
 [1.2,-2.2,0.3],[0.4,-1.9,0.6],[-0.4,-2.3,0.2],[-1.2,-2.0,0.3],[-1.6,-2.7,0.0],[-0.8,-3.1,0.2],[0.2,-2.8,0.1],[0.9,-3.2,0.3],[1.4,-2.8,0.5]
];
const K=0.66;const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0]*K,p[1]*K+0.05,p[2]*K)),false,"catmullrom",0.5);
// Radius: stomach and duodenum wider, coils thinner, with haustral bulges
function radius(t){const base=0.34-0.12*t;const fold=0.04*Math.sin(t*Math.PI*26);return base+fold;}
const geo=new THREE.TubeGeometry(curve,700,1,40,false);
const pos=geo.attributes.position;const n=geo.parameters.radialSegments;
const frames=curve.computeFrenetFrames(700,false);
for(let i=0;i<=700;i++){
  const t=i/700;const c=curve.getPointAt(t);const r=radius(t)*1.0;
  for(let j=0;j<=n;j++){
    const idx=i*(n+1)+j;const N=frames.normals[i],B=frames.binormals[i];
    const a=2*Math.PI*j/n;
    pos.setXYZ(idx,c.x+r*(Math.cos(a)*N.x+Math.sin(a)*B.x),c.y+r*(Math.cos(a)*N.y+Math.sin(a)*B.y),c.z+r*(Math.cos(a)*N.z+Math.sin(a)*B.z));
  }
}
geo.computeVertexNormals();
scene.add(new THREE.Mesh(geo,mat));
// Stomach pouch: a soft ellipsoid at the top
const pouch=new THREE.Mesh(new THREE.SphereGeometry(0.62*K,64,48),mat);pouch.scale.set(1.0,1.35,0.8);pouch.position.set(1.05*K,2.55*K+0.05,0);scene.add(pouch);
renderer.render(scene,cam);
window.__done=true;
</script></body></html>
